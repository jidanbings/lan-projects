org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The gradle root sits under a non-ASCII path (桌面 in D:\桌面\开发lan-projects).
# On Windows AGP hard-fails the build (StopExecutionException) when the root
# path is non-ASCII unless this override is set, so this flag is REQUIRED and
# must not be removed while the project lives here. AGP prints an
# "experimental" WARNING whenever the flag is set - that is expected and
# harmless, and it cannot be silenced from Gradle/AGP config. To eliminate
# both the flag and the warning, relocate the project to an all-ASCII path
# (e.g. D:\lan-projects) and delete this line.
android.overridePathCheck=true
