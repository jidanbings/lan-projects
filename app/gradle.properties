org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The Gradle root must be an all-ASCII path: AGP's checkPathForErrors()
# fails the build when the root path is non-ASCII (桌面), which is why this
# override used to be set. The project is now built through the directory
# junction C:\lanp -> <repo parent>\lan-projects (see build-apk.bat), so
# every path Gradle sees is ASCII and this flag stays OFF - which also
# removes its "experimental" warning. Do NOT invoke Gradle directly from
# the non-ASCII path while the flag is off: cd into C:\lanp\app instead.
# android.overridePathCheck=true
